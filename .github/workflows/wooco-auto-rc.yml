name: WooCommerce — Auto RC

on:
  create:

jobs:
  # -----------------------------------------------------------------------
  # 1. APPLY RELEASE — update version files from release.json
  # -----------------------------------------------------------------------
  apply-release:
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: payplug/template-ci/.github/workflows/wooco-apply-release.yml@main
    with:
      ref: ${{ github.ref_name }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------------
  # 2. CREATE RC0 TAG — pushed with RELEASE_TOKEN (not GITHUB_TOKEN) so the
  #    tag push can trigger wooco-rc-prerelease.yml, which creates the
  #    pre-release and attaches the QA zip
  # -----------------------------------------------------------------------
  create-rc0-tag:
    name: Create RC0 tag
    needs: apply-release
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: payplug/template-ci/.github/workflows/auto_tag_rc.yml@main
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
