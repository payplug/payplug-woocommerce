name: WooCommerce — RC Pre-Release

on:
  push:
    tags:
      - '*.*.*-rc*'

jobs:
  # -----------------------------------------------------------------------
  # 1. CREATE PRE-RELEASE — from changelog in release.json
  # -----------------------------------------------------------------------
  create-prerelease:
    name: Create GitHub pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read changelog from release.json
        run: php -r "echo json_decode(file_get_contents('release.json'))->changelog;" > /tmp/changelog.txt

      - name: Create GitHub Pre-Release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/changelog.txt \
            --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -----------------------------------------------------------------------
  # 2. BUILD QA ZIP + ATTACH — chained in this same run since the pre-release
  #    above is bot-created and won't itself trigger release: [published]
  # -----------------------------------------------------------------------
  build-qa-zip:
    name: Build QA zip
    needs: create-prerelease
    uses: payplug/template-ci/.github/workflows/wooco-zip-generation.yml@main
    with:
      php-version: '7.4'
      node-version: '20'
      env: qa
      ref: ${{ github.ref_name }}
      upload-to-release: true
    secrets:
      cdn-payplug: ${{ secrets.CDN_PAYPLUG_QA }}
      api-payplug: ${{ secrets.PAYPLUG_API_QA }}
      api-payplug-retail: ${{ secrets.API_RETAIL_QA }}
      github-token: ${{ secrets.GITHUB_TOKEN }}
